<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPN / Proxy Blocked</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%230ea5e9' /><stop offset='100%25' stop-color='%234f46e5' /></linearGradient></defs><rect width='100' height='100' rx='20' fill='url(%23g)'/><text x='50' y='65' font-family='sans-serif' font-weight='900' font-size='50' fill='white' text-anchor='middle'>2Z2</text></svg>">
    

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#0b0f1f;
color:#cbd5e1;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
display:inline-block;
background:#11182e;
border:1px solid #c48a2a;
border-radius:18px;
padding:40px;
text-align:center;
box-shadow:0 10px 40px rgba(0,0,0,0.6);
}

.icon{
font-size:52px;
margin-bottom:15px;
}

.title{
color:#f5a623;
font-size:30px;
font-weight:700;
margin-bottom:20px;
}

.text{
font-size:18px;
line-height:1.6;
color:#9ca3af;
}

.ip-label{
margin-top:18px;
font-size:16px;
}

.ipbox{
margin-top:10px;
background:#2a1f0e;
display:inline-block;
padding:10px 18px;
border-radius:8px;
color:#f5a623;
font-family:monospace;
font-size:18px;
}

.contact{
margin-top:25px;
font-size:16px;
}

.home-btn{
display:inline-block;
margin-top:20px;
padding:10px 20px;
background:#f5a623;
color:#111;
border-radius:8px;
font-weight:600;
text-decoration:none;
}

.home-btn:hover{
background:#ffb84d;
}

a{
color:#6ea8ff;
text-decoration:none;
}

a:hover{
text-decoration:underline;
}

</style>
</head>

<body>

<div class="container">

<div class="icon">🛡️</div>

<div class="title">VPN / Proxy Detected</div>

<div class="text">
The <b>2Z2 Platform</b> does not allow access through VPN, Proxy, or Tor networks.
</div>

<div class="text">
Please disable your VPN and try again.
</div>

<div class="ip-label">Your IP:</div>

<div class="ipbox" id="ip">Loading...</div>

<div class="contact">
If you are not using a VPN, contact
<a href="https://fb.com/thuong.hai.581" target="_blank">fb.com/thuong.hai.581</a>
</div>

<a href="/" class="home-btn">Go Home</a>

</div>

<script>
fetch("https://api.ipify.org?format=json")
.then(r => r.json())
.then(data => {
document.getElementById("ip").innerText = data.ip;
});
</script>

</body>
</html>
