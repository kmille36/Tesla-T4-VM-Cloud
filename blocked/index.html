<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPN / Proxy Blocked</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%2300a3cc' /><stop offset='100%25' stop-color='%2300d4ff' /></linearGradient></defs><rect width='100' height='100' rx='20' fill='url(%23g)'/><text x='50' y='65' font-family='sans-serif' font-weight='900' font-size='50' fill='white' text-anchor='middle'>2Z2</text></svg>">

<style>
:root {
    --bg-0: #000f1f;
    --bg-1: #001a2e;
    --bg-2: #000d18;
    --text-1: #a8e6ff;
    --text-2: #ffffff;
    --accent-cyan: #00a3cc;
    --accent-cyan-2: #00d4ff;
    --error: #ff8c42;
    --error-light: #ffb399;
    --radius-md: 12px;
    --radius-lg: 16px;
    --shadow-2: 0 8px 24px rgba(0, 0, 0, 0.7);
    --shadow-button: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 18px rgba(0, 212, 255, 0.12);
    --glow-cyan: 0 0 30px rgba(0, 212, 255, 0.15);
    --glow-warning: 0 0 30px rgba(255, 140, 66, 0.18);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: env(safe-area-inset-top) 16px;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text-2);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    display: flex;
    justify-content: center;
    align-items: center;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(135deg, var(--bg-0) 0%, var(--bg-1) 50%, var(--bg-2) 100%);
}

.container {
    max-width: 460px;
    width: 100%;
    background: linear-gradient(135deg, rgba(0, 30, 50, 0.95) 0%, rgba(0, 15, 30, 0.95) 100%);
    border: 2px solid var(--error);
    border-radius: var(--radius-lg);
    padding: 36px 28px;
    text-align: center;
    box-shadow: var(--shadow-2), var(--glow-warning);
    backdrop-filter: blur(10px);
}

.icon {
    font-size: 56px;
    margin-bottom: 12px;
    filter: drop-shadow(0 0 12px rgba(255, 140, 66, 0.5));
}

.title {
    color: var(--error);
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 18px;
    letter-spacing: 0.5px;
}

.text {
    font-size: 16px;
    line-height: 1.6;
    color: var(--text-1);
    margin: 8px 0;
}

.text b {
    color: var(--accent-cyan-2);
    font-weight: 600;
}

.ip-label {
    margin-top: 22px;
    font-size: 15px;
    color: rgba(255, 255, 255, 0.7);
}

.ipbox {
    margin-top: 10px;
    background: rgba(0, 30, 50, 0.8);
    border: 1px solid var(--error);
    display: inline-block;
    padding: 10px 20px;
    border-radius: var(--radius-md);
    color: var(--error-light);
    font-family: 'Menlo', 'Consolas', monospace;
    font-size: 17px;
    box-shadow: 0 0 12px rgba(255, 140, 66, 0.15);
}

.contact {
    margin-top: 26px;
    font-size: 15px;
    color: rgba(255, 255, 255, 0.75);
}

.home-btn {
    display: inline-block;
    margin-top: 24px;
    padding: 12px 28px;
    background-color: #003d7a;
    border: 2px solid var(--accent-cyan-2);
    border-radius: var(--radius-md);
    color: var(--text-2);
    font-size: 16px;
    font-weight: 500;
    text-decoration: none;
    box-shadow: var(--shadow-button);
    transition: all 0.25s ease;
}

.home-btn:hover {
    background-color: #0052a3;
    box-shadow: var(--shadow-button), var(--glow-cyan);
    transform: translateY(-1px);
}

a {
    color: var(--accent-cyan-2);
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
    color: var(--accent-cyan-light, #00ffff);
}
</style>
</head>

<body>

<div class="container">

<div class="icon">🛡️</div>

<div class="title">VPN / Proxy Detected</div>

<div class="text">
The <b>2Z2 Platform</b> does not allow access through VPN, Proxy, or Tor networks.
</div>

<div class="text">
Please disable your VPN and try again.
</div>

<div class="ip-label">Your IP:</div>

<div class="ipbox" id="ip">Loading...</div>

<div class="contact">
If you are not using a VPN, contact
<a href="https://fb.com/thuong.hai.581" target="_blank">fb.com/thuong.hai.581</a>
</div>

<a href="/" class="home-btn">Go Home</a>

</div>

<script>
fetch("https://api.ipify.org?format=json")
.then(r => r.json())
.then(data => {
document.getElementById("ip").innerText = data.ip;
})
.catch(() => {
document.getElementById("ip").innerText = "Unavailable";
});
</script>

</body>
</html>
